name: 🐞 Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! ⚠️ **Never attach documents that contain personal or confidential data.**
  - type: input
    id: tool
    attributes:
      label: Tool
      description: Which tool were you using?
      placeholder: e.g. Merge PDF
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Upload ...
        3. Click ...
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - Live demo (GitHub Pages)
        - npm run dev
        - Docker
        - Other self-hosted
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 140 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open DevTools (F12), go to Console, and paste any red errors.
      render: text
