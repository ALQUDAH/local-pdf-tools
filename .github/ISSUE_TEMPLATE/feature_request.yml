name: ✨ Feature or new tool request
description: Suggest a new tool or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the task or problem, e.g. "I need to convert a PDF to EPUB".
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should it work?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this
