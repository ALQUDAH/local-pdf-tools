name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching a CHANGELOG.md heading (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi
          {
            echo "**Try it live:** https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo
            cat notes.md
          } > release-notes.md
          cat release-notes.md
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --latest

  desktop:
    needs: release
    uses: ./.github/workflows/desktop.yml
    with:
      tag: v${{ inputs.version }}
    permissions:
      contents: write
