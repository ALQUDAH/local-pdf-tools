name: Release

on:
  # Pushing a tag like v1.6.0 (done by the private repo's Publish workflow) creates the release
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching a CHANGELOG.md heading (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    # Releases and installers are published from the public repo only
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi
          {
            echo "**Try it live:** https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo
            cat notes.md
          } > release-notes.md
          cat release-notes.md
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Re-running for an existing release (e.g. after a failed installer build) reuses it
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; attaching installers to it."
            gh release edit "v$VERSION" --notes-file release-notes.md
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --notes-file release-notes.md \
              --latest
          fi

  desktop:
    needs: release
    uses: ./.github/workflows/desktop.yml
    with:
      tag: v${{ needs.release.outputs.version }}
    permissions:
      contents: write
