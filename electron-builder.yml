appId: io.github.alqudah.localpdftools
productName: Local PDF Tools
copyright: Copyright © 2026 Local PDF Tools contributors
directories:
  app: desktop
  buildResources: desktop/build
  output: release
files:
  - "**/*"
  - "!build/**"
  # Trim parts of PDF.js / pdf-parse that the Node server never loads
  - "!**/*.map"
  - "!**/*.d.{ts,mts,cts}"
  - "!node_modules/pdf-parse/dist/pdf-parse/web/**"
  - "!node_modules/pdf-parse/dist/worker/**"
  - "!node_modules/pdfjs-dist/{build,web,types,image_decoders}/**"
  - "!node_modules/pdfjs-dist/legacy/{web,image_decoders}/**"
asar: true
# Native deps (@napi-rs/canvas) ship prebuilt N-API binaries; nothing to rebuild
npmRebuild: false
artifactName: "Local-PDF-Tools-${version}-${os}-${arch}.${ext}"
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Local PDF Tools

mac:
  # Architecture is chosen on the command line (--arm64 / --x64), see .github/workflows/desktop.yml
  target: dmg
  category: public.app-category.productivity
  # Unsigned build: users right-click > Open the first time (see README)
  identity: null

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  maintainer: ALQUDAH <8654990+ALQUDAH@users.noreply.github.com>
  synopsis: Private PDF toolkit that runs on your computer
